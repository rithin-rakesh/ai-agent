services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-job-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./sql:/app/sql
    restart: unless-stopped
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
